name: Tests and public source audit
on:
  push:
    branches: [main, feat/re4-controls]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          release: false
          msystem: MINGW64
          suppress-deprecation-warnings: msystem-mingw64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Host tests and actual UI rendering
        run: python build.py --test
      - name: Audit source and full Git history
        run: python tools/audit_public.py --history
