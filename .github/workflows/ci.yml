name: Tests and public source audit
on:
  push:
    branches: [main, feat/re4-controls]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          release: false
          msystem: MINGW64
          suppress-deprecation-warnings: msystem-mingw64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Host tests and actual UI rendering
        id: host-tests
        run: python build.py --test
      - name: Show failed host test logs
        if: ${{ failure() && steps.host-tests.outcome == 'failure' }}
        shell: pwsh
        run: |
          $latest = 'build/tests/latest.json'
          if (!(Test-Path -LiteralPath $latest)) {
            Write-Output 'Host runner did not write results; see the preceding step.'
            exit 0
          }
          $run = Get-Content -LiteralPath $latest -Raw | ConvertFrom-Json
          $results = Get-Content -LiteralPath $run.results -Raw | ConvertFrom-Json
          foreach ($preparation in $results.preparations | Where-Object status -ne 'passed') {
            Write-Output "Preparation failed: $($preparation.name): $($preparation.error)"
          }
          foreach ($case in $results.cases | Where-Object status -ne 'passed') {
            Write-Output "::group::Failed test: $($case.name) [$($case.status)]"
            if ($case.error) { Write-Output $case.error }
            foreach ($step in $case.steps | Where-Object returncode -ne 0) {
              foreach ($stream in 'stdout', 'stderr') {
                $log = $step.$stream
                if ($log -and (Test-Path -LiteralPath $log)) {
                  Write-Output "${stream}: $log (last 200 lines)"
                  Get-Content -LiteralPath $log -Tail 200
                }
              }
            }
            Write-Output '::endgroup::'
          }
      - name: Audit source and full Git history
        if: ${{ always() }}
        run: python tools/audit_public.py --history
